<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ludus · Liga dos Leitores</title>
<style>
:root{--acc:#4f46e5;--acc-soft:#e9e7fb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#eef0f6;color:#171a26}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid #d8dbe6;border-radius:10px;width:100%;background:#fff;color:#171a26}
textarea{min-height:90px;resize:vertical}
input[type=file]{padding:8px;background:#f8f9fc}
input[type=color]{padding:4px;height:44px}
label{font-size:13px;font-weight:600;display:block;margin:12px 0 6px;color:#333849}
.btn{background:var(--acc);color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:#fff;color:#333849;border:1px solid #d8dbe6}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:#f8f9fc;border:1px solid #e3e6f0;border-radius:16px;padding:20px}
.badge{font-size:11px;font-weight:800;letter-spacing:.4px;padding:4px 10px;border-radius:999px;display:inline-block}
.b-green{background:#d9f3e8;color:#0f766e}.b-purple{background:var(--acc-soft);color:var(--acc)}.b-amber{background:#fdf3d7;color:#92600a}.b-gray{background:#e8eaf1;color:#565b6e}.b-red{background:#fde5e6;color:#b3261e}
.bar{height:8px;background:#e3e6f0;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid #e3e6f0;text-align:left}.tbl th{font-size:12px;color:#565b6e;text-transform:uppercase;letter-spacing:.4px}
.muted{color:#565b6e;font-size:14px}.tiny{color:#7a7f93;font-size:12px}
h1{font-size:26px}h2{font-size:19px;margin-bottom:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:800px){.grid2,.grid3{grid-template-columns:1fr}}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:16px}
.auth{width:100%;max-width:430px;background:#f8f9fc;border:1px solid #e3e6f0;border-radius:18px;padding:28px;text-align:center}
.logo{font-size:22px;font-weight:800;display:flex;gap:8px;justify-content:center;align-items:center}
.logo i{width:10px;height:10px;background:var(--acc);border-radius:3px;display:inline-block}
.tabs{display:flex;background:#eceef5;border-radius:12px;padding:4px;margin:18px 0}
.tabs button{flex:1;padding:10px;border-radius:10px;font-weight:700;color:#565b6e}
.tabs button.on{background:#fff;color:var(--acc);box-shadow:0 1px 4px #0001}
.err{background:#fde5e6;color:#b3261e;border-radius:10px;padding:10px;font-size:13px;margin-top:10px;text-align:left}
.ok-note{background:#d9f3e8;color:#0f766e;border-radius:10px;padding:8px;font-size:13px;margin-top:8px;text-align:left}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:#f8f9fc;border-right:1px solid #e3e6f0;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .logo{justify-content:flex-start;padding:6px 10px 16px}
.navb{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;color:#4b5065;font-weight:600;width:100%;text-align:left}
.navb.on{background:var(--acc-soft);color:var(--acc)}
.side .foot{margin-top:auto;border-top:1px solid #e3e6f0;padding-top:12px;display:flex;gap:10px;align-items:center}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--acc-soft);color:var(--acc);font-weight:800;display:grid;place-items:center;flex:none;font-size:16px}
.top{padding:12px 22px;background:#f8f9fc;border-bottom:1px solid #e3e6f0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{background:#fff;border:1px solid #e3e6f0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.page{padding:26px 22px;max-width:1040px;margin:0 auto;width:100%}
.mobnav{display:none}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.mobnav{display:flex;overflow-x:auto;gap:8px;padding:10px 14px;background:#f8f9fc;border-bottom:1px solid #e3e6f0}.mobnav .navb{width:auto;white-space:nowrap;border:1px solid #e3e6f0;background:#fff}}
.empty{border:1px dashed #cfd3e2;border-radius:16px;padding:34px;text-align:center;color:#565b6e}
.empty .ico{width:46px;height:46px;border-radius:50%;background:var(--acc-soft);display:grid;place-items:center;margin:0 auto 12px;font-size:20px}
.overlay{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:#fff;border-radius:18px;max-width:660px;width:100%;max-height:86vh;overflow:auto;padding:24px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#171a26;color:#fff;padding:12px 20px;border-radius:12px;z-index:99;font-size:14px;box-shadow:0 6px 24px #0004}
.opt{display:flex;gap:10px;align-items:center;border:1px solid #d8dbe6;border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer;font-weight:400}
.opt input{width:auto}
.mimg-wrap{display:flex;justify-content:center;align-items:center;margin-top:14px;background:#fff;border:1px solid #e3e6f0;border-radius:14px;padding:10px;box-shadow:0 4px 14px #00000012}
.mimg{max-width:100%;max-height:420px;width:auto;height:auto;object-fit:contain;border-radius:10px;display:block;cursor:zoom-in}
.zoomwrap{position:fixed;inset:0;background:#000000dd;z-index:80;overflow:auto;display:flex}
.zoomwrap img{margin:auto;max-width:96vw;max-height:96vh;object-fit:contain;cursor:zoom-in;border-radius:8px;background:#fff}
.zoomwrap img.full{max-width:none;max-height:none;cursor:zoom-out}
.thumb{width:54px;height:54px;object-fit:cover;border-radius:10px;flex:none;border:1px solid #e3e6f0}
.fx-negrito{font-weight:800}
.fx-italico{font-style:italic}
.fx-neon{text-shadow:0 0 6px currentColor,0 0 14px currentColor}
.fx-rainbow{background:linear-gradient(90deg,#f43f5e,#f59e0b,#10b981,#3b82f6,#8b5cf6,#f43f5e);-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:rbw 3s linear infinite;background-size:200% 100%}
@keyframes rbw{to{background-position:200% 0}}
.sym-anim{display:inline-block;animation:hue 4s linear infinite}
@keyframes hue{0%{filter:hue-rotate(0deg) drop-shadow(0 0 5px #7c3aed)}100%{filter:hue-rotate(360deg) drop-shadow(0 0 5px #7c3aed)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= DADOS ================= */
const DB_KEY='ligaLeitoresDB_v2', SES_KEY='ligaLeitoresSession_v1';
const TEACHER_CODE='ADM2026'; /* código secreto da coordenação — não exibido em nenhuma tela */
const SKILLS=[['expl','Informações explícitas'],['inf','Inferências'],['pers','Personagens e conflitos'],['rec','Recursos expressivos'],['evid','Interpretação com evidências']];
const CATS={avatar:'Avatar',symbol:'Símbolo',nameColor:'Cor do nome',textColor:'Cor da escrita',textEffect:'Efeito de escrita',theme:'Tema'};
const DEFAULT_SHOP=[
 {id:'cartao',name:'Cartão +50 XP',price:80,desc:'Consumível: aplica +50 XP imediatamente.',icon:'⚡',consume:true},
 {id:'av_coruja',name:'Avatar Coruja',price:60,desc:'Um companheiro sábio para suas leituras.',icon:'🦉',effect:{type:'avatar',value:'🦉'}},
 {id:'av_dragao',name:'Avatar Dragão Literário',price:90,desc:'Guardião das histórias épicas.',icon:'🐉',effect:{type:'avatar',value:'🐉'}},
 {id:'av_mago',name:'Avatar Mago das Páginas',price:90,desc:'Transforma letras em magia.',icon:'🧙',effect:{type:'avatar',value:'🧙'}},
 {id:'av_raposa',name:'Avatar Raposa Leitora',price:70,desc:'Astuta e curiosa.',icon:'🦊',effect:{type:'avatar',value:'🦊'}},
 {id:'sy_chama',name:'Símbolo Chama Azul Mística',price:150,desc:'Símbolo roxo com chama azul que muda de cor ao lado do seu nome.',icon:'🔥',effect:{type:'symbol',value:{e:'🔥',anim:true}}},
 {id:'sy_estrela',name:'Símbolo Estrela da Liga',price:100,desc:'Brilhe no ranking.',icon:'⭐',effect:{type:'symbol',value:{e:'⭐'}}},
 {id:'sy_escudo',name:'Símbolo Escudo da Liga',price:110,desc:'Proteção e honra literária.',icon:'🛡️',effect:{type:'symbol',value:{e:'🛡️'}}},
 {id:'nc_rubi',name:'Nome Rubi',price:60,desc:'Seu nome em vermelho vibrante.',icon:'🔴',effect:{type:'nameColor',value:'#e11d48'}},
 {id:'nc_esmeralda',name:'Nome Esmeralda',price:60,desc:'Seu nome em verde precioso.',icon:'🟢',effect:{type:'nameColor',value:'#059669'}},
 {id:'nc_oceano',name:'Nome Oceano',price:60,desc:'Seu nome em azul profundo.',icon:'🔵',effect:{type:'nameColor',value:'#0284c7'}},
 {id:'nc_dourado',name:'Nome Dourado',price:70,desc:'Seu nome com brilho de ouro.',icon:'🟡',effect:{type:'nameColor',value:'#b45309'}},
 {id:'tc_violeta',name:'Escrita Violeta',price:50,desc:'Suas respostas em violeta.',icon:'✒️',effect:{type:'textColor',value:'#7c3aed'}},
 {id:'tc_turquesa',name:'Escrita Turquesa',price:50,desc:'Suas respostas em turquesa.',icon:'🖊️',effect:{type:'textColor',value:'#0d9488'}},
 {id:'tc_carmim',name:'Escrita Carmim',price:50,desc:'Suas respostas em carmim.',icon:'🖋️',effect:{type:'textColor',value:'#be123c'}},
 {id:'fx_negrito',name:'Efeito Negrito Real',price:40,desc:'Respostas em negrito marcante.',icon:'🅱️',effect:{type:'textEffect',value:'negrito'}},
 {id:'fx_italico',name:'Efeito Itálico Clássico',price:40,desc:'Respostas com estilo literário.',icon:'✍️',effect:{type:'textEffect',value:'italico'}},
 {id:'fx_neon',name:'Efeito Neon Noturno',price:80,desc:'Respostas que brilham no escuro.',icon:'💡',effect:{type:'textEffect',value:'neon'}},
 {id:'fx_rainbow',name:'Efeito Arco-íris Mágico',price:120,desc:'Respostas com cores em movimento.',icon:'🌈',effect:{type:'textEffect',value:'rainbow'}},
 {id:'th_roxo',name:'Tema Roxo Estelar',price:120,desc:'Visual roxo clássico da Liga.',icon:'💜',effect:{type:'theme',value:{acc:'#4f46e5',soft:'#e9e7fb'}}},
 {id:'th_floresta',name:'Tema Floresta Encantada',price:120,desc:'Verde das matas dos contos.',icon:'🌲',effect:{type:'theme',value:{acc:'#059669',soft:'#d9f3e8'}}},
 {id:'th_oceano',name:'Tema Oceano Profundo',price:120,desc:'Azul das aventuras marítimas.',icon:'🌊',effect:{type:'theme',value:{acc:'#0284c7',soft:'#dbeafe'}}},
 {id:'th_brasas',name:'Tema Brasas do Dragão',price:120,desc:'Vermelho das fogueiras de história.',icon:'🐲',effect:{type:'theme',value:{acc:'#dc2626',soft:'#fee2e2'}}}];
const DEFAULT_ACH=[
 {id:'m1',name:'Primeira Missão',desc:'Conclua sua primeira missão de leitura.',coins:10,cond:u=>doneCount(u)>=1},
 {id:'m3',name:'Leitor Constante',desc:'Conclua 3 missões.',coins:20,cond:u=>doneCount(u)>=3},
 {id:'m5',name:'Maratonista de Missões',desc:'Conclua 5 missões.',coins:30,cond:u=>doneCount(u)>=5},
 {id:'m10',name:'Lenda da Liga',desc:'Conclua 10 missões.',coins:50,cond:u=>doneCount(u)>=10},
 {id:'expl',name:'Olho Vivo',desc:'Acerte uma missão de informações explícitas.',coins:10,cond:u=>skillDone(u,'expl')>=1},
 {id:'inf',name:'Detetive de Inferências',desc:'Acerte uma missão de inferências.',coins:15,cond:u=>skillDone(u,'inf')>=1},
 {id:'pers',name:'Leitor de Personagens',desc:'Acerte uma missão de personagens e conflitos.',coins:15,cond:u=>skillDone(u,'pers')>=1},
 {id:'rec',name:'Caçador de Recursos',desc:'Acerte uma missão de recursos expressivos.',coins:15,cond:u=>skillDone(u,'rec')>=1},
 {id:'ev',name:'Mestre das Evidências',desc:'Acerte uma missão de interpretação com evidências.',coins:15,cond:u=>skillDone(u,'evid')>=1},
 {id:'b3',name:'Explorador de Bibliotecas',desc:'Conclua missões de 3 livros diferentes.',coins:25,cond:u=>booksDone(u)>=3},
 {id:'lv2',name:'Nível 2',desc:'Acumule 500 XP.',coins:25,cond:u=>u.xp>=500},
 {id:'lv3',name:'Nível 3',desc:'Acumule 1000 XP.',coins:40,cond:u=>u.xp>=1000},
 {id:'rich',name:'Cofre Cheio',desc:'Junte 100 moedas.',coins:10,cond:u=>u.coins>=100}];
let db=loadDB(), session=localStorage.getItem(SES_KEY)||null;
let ui={authTab:'login',authError:'',sPage:'inicio',tPage:'visao',selClass:null,modal:null,reveal:{}};
let pendingImage=null;
function loadDB(){try{const d=JSON.parse(localStorage.getItem(DB_KEY));if(d&&d.users){d.teacherCodes=[TEACHER_CODE];d.shopItems=d.shopItems||[];d.achv=d.achv||[];return d}}catch(e){}return{users:[],classes:[],missions:[],responses:[],teacherCodes:[TEACHER_CODE],counters:{aluno:0,professor:0},shopItems:[],achv:[]}}
function save(){try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){toast('⚠️ Armazenamento do navegador cheio: remova missões com imagem.')}}
function me(){return db.users.find(u=>u.id===session)}
function allItems(){return DEFAULT_SHOP.concat(db.shopItems||[])}
function allAch(){return DEFAULT_ACH.concat(db.achv||[])}
function eqVal(u,type){if(!u||!u.equipped)return null;const id=u.equipped[type];if(!id)return null;const it=allItems().find(i=>i.id===id);return it&&it.effect?it.effect.value:null}
function displayName(s){const nc=eqVal(s,'nameColor');const sy=eqVal(s,'symbol');
 return`${sy?`<span class="${sy.anim?'sym-anim':''}" style="margin-right:4px">${sy.e}</span>`:''}<span style="${nc?'color:'+nc:''}">${s.name}</span>`}
function levelOf(xp){return Math.floor(xp/500)+1}
function fmtDate(d){if(!d)return'—';return new Date(d+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})}
function missionById(id){return db.missions.find(m=>m.id===id)}
function doneCount(u){return db.responses.filter(r=>r.studentId===u.id&&r.status==='ok').length}
function skillDone(u,s){return db.responses.filter(r=>r.studentId===u.id&&r.status==='ok'&&missionById(r.missionId)&&missionById(r.missionId).skill===s).length}
function booksDone(u){return new Set(db.responses.filter(r=>r.studentId===u.id&&r.status==='ok').map(r=>missionById(r.missionId)?missionById(r.missionId).book:null)).size}
function studentsOf(code){return db.users.filter(u=>u.role==='aluno'&&u.classCode===code)}
function myClasses(){return db.classes.filter(c=>c.teacherId===session)}
function selClass(){return db.classes.find(c=>c.code===ui.selClass)||myClasses()[0]}
function classOf(u){return db.classes.find(c=>c.code===u.classCode)}
function skillName(s){const k=SKILLS.find(x=>x[0]===s);return k?k[1]:s}
function statusOf(u,m){const rs=db.responses.filter(r=>r.missionId===m.id&&r.studentId===u.id);if(rs.some(r=>r.status==='ok'))return'done';if(rs.some(r=>r.status==='pending'))return'pending';if(rs.some(r=>r.status==='wrong'))return'retry';return'open'}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function copy(txt){if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Copiado: '+txt));else toast(txt)}
function emptyHTML(icon,t,d){return`<div class="empty" style="margin-top:18px"><div class="ico">${icon}</div><b>${t}</b><p class="muted" style="margin-top:6px">${d}</p></div>`}
/* ================= IMAGEM ================= */
function onMissionImage(input){const f=input.files[0];if(!f)return;
 if(!/^image\/(png|jpeg|webp|gif)$/.test(f.type))return toast('Use PNG, JPEG, WebP ou GIF.');
 const reader=new FileReader();
 reader.onload=e=>{const data=e.target.result;
  if(f.size<=800000){pendingImage=data;previewUpdate();toast('🖼 Imagem anexada com qualidade original.');return}
  const img=new Image();
  img.onload=()=>{let w=img.width,h=img.height;const max=1600;
   if(Math.max(w,h)>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
   const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
   pendingImage=cv.toDataURL('image/jpeg',0.92);previewUpdate();toast('🖼 Imagem grande otimizada sem perda visível.')};
  img.onerror=()=>toast('Não foi possível ler a imagem.');
  img.src=data};
 reader.readAsDataURL(f)}
function previewUpdate(){const box=document.getElementById('imgPreview');if(!box)return;
 box.innerHTML=pendingImage?`<div class="mimg-wrap"><img src="${pendingImage}" class="mimg" onclick="openZoom(this.src)"></div><p class="tiny" style="margin-top:6px;text-align:center">🔍 Clique na imagem para ampliar</p><button class="btn ghost sm" style="margin-top:8px" onclick="removeImage()">Remover imagem</button>`:''}
function removeImage(){pendingImage=null;const inp=document.getElementById('f_img');if(inp)inp.value='';previewUpdate()}
function openZoom(src){const d=document.createElement('div');d.className='zoomwrap';d.onclick=e=>{if(e.target===d)d.remove()};
 d.innerHTML=`<img src="${src}" onclick="this.classList.toggle('full')" title="Clique para dar zoom / reduzir">
 <button class="btn ghost sm" style="position:fixed;top:14px;right:14px;z-index:2" onclick="this.parentNode.remove()">✕ fechar</button>
 <span class="tiny" style="position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#000000aa;color:#fff;padding:8px 14px;border-radius:999px;z-index:2">Clique na imagem para ver em 100% · role para navegar · clique fora para fechar</span>`;
 document.body.appendChild(d)}
/* ================= AUTENTICAÇÃO ================= */
function setAuthTab(t){ui.authTab=t;ui.authError='';render()}
function setErr(m){ui.authError=m;render()}
function onCodeInput(){const v=document.getElementById('f_tcode').value.trim().toUpperCase();const box=document.getElementById('codeHint');const extra=document.getElementById('teacherExtra');const lbl=document.getElementById('roleLbl');
 if(!v){box.innerHTML='';extra.style.display='none';if(lbl)lbl.textContent='estudante';return}
 if(db.teacherCodes.includes(v)){box.innerHTML='<div class="ok-note">✓ Código válido — a conta será de <b>professor</b>.</div>';extra.style.display='block';if(lbl)lbl.textContent='professor'}
 else{box.innerHTML='<div class="err">Código não reconhecido. Deixe em branco para criar conta de <b>aluno</b>.</div>';extra.style.display='none';if(lbl)lbl.textContent='estudante'}}
function doLogin(){const e=document.getElementById('l_email').value.trim().toLowerCase(),p=document.getElementById('l_pass').value;const u=db.users.find(x=>x.email===e&&x.pass===p);if(!u){ui.authError='E-mail ou senha incorretos.';return render()}session=u.id;localStorage.setItem(SES_KEY,session);ui.selClass=null;render()}
function genClassCode(){let c;do{c='LIGA-'+Math.random().toString(36).slice(2,6).toUpperCase()}while(db.classes.some(x=>x.code===c));return c}
function doRegister(){const name=document.getElementById('f_name').value.trim(),email=document.getElementById('f_email').value.trim().toLowerCase(),pass=document.getElementById('f_pass').value,code=document.getElementById('f_tcode').value.trim().toUpperCase(),cname=document.getElementById('f_classname').value.trim();
 if(name.length<3)return setErr('Informe seu nome completo.');
 if(!email.includes('@'))return setErr('Informe um e-mail válido (Gmail).');
 if(db.users.some(u=>u.email===email))return setErr('Este e-mail já possui conta. Use "Entrar".');
 if(pass.length<8)return setErr('A senha precisa de pelo menos 8 caracteres.');
 let role='aluno';
 if(code){if(!db.teacherCodes.includes(code))return setErr('Código de professor inválido. Deixe em branco para criar conta de aluno.');role='professor'}
 db.counters[role]++;const id=(role==='aluno'?'AL-':'PR-')+'2026-'+String(db.counters[role]).padStart(4,'0');
 db.users.push({id,name,email,pass,role,xp:0,coins:0,classCode:null,inventory:[],achievements:[],equipped:{},createdAt:new Date().toISOString(),enrolledAt:null});
 if(role==='professor')db.classes.push({code:genClassCode(),name:cname||('Turma de '+name),year:2026,subject:'',teacherId:id});
 save();session=id;localStorage.setItem(SES_KEY,session);toast('Conta criada! Seu ID: '+id);render()}
function logout(){session=null;localStorage.removeItem(SES_KEY);render()}
function resetDemo(){localStorage.removeItem(DB_KEY);localStorage.removeItem(SES_KEY);location.reload()}
/* ================= SENHAS ================= */
function openChPass(){ui.modal={type:'chpass'};render()}
function submitChPass(){const u=me();const cur=document.getElementById('c_cur').value,n1=document.getElementById('c_new').value,n2=document.getElementById('c_new2').value;
 if(cur!==u.pass)return toast('Senha atual incorreta.');
 if(n1.length<8)return toast('A nova senha precisa de pelo menos 8 caracteres.');
 if(n1!==n2)return toast('A confirmação não coincide.');
 u.pass=n1;save();ui.modal=null;toast('🔑 Senha alterada com sucesso.');render()}
function openForgot(){ui.modal={type:'forgot',step:1,uid:null};render()}

function condOk(u,a){if(typeof a.cond==='function')return a.cond(u);
 if(!a.cond)return false;
 if(a.cond.type==='missoes')return doneCount(u)>=a.cond.n;
 if(a.cond.type==='xp')return u.xp>=a.cond.n;

 return false}
function checkAch(u){if(u.role!=='aluno')return;allAch().forEach(a=>{if(!u.achievements.includes(a.id)&&condOk(u,a)){u.achievements.push(a.id);u.coins+=a.coins;setTimeout(()=>toast('🎖️ Conquista: '+a.name+' (+'+a.coins+' moedas)'),400)}})}
function award(u,m){u.xp+=m.xp;u.coins+=m.coins;checkAch(u);save()}
function joinClass(){const code=document.getElementById('join_code').value.trim().toUpperCase();const c=db.classes.find(c=>c.code===code);if(!c)return toast('Código de turma não encontrado.');const u=me();u.classCode=c.code;u.enrolledAt=new Date().toISOString();save();toast('Vinculado à turma '+c.name+'!');render()}
function buy(id){const u=me(),it=allItems().find(i=>i.id===id);if(u.coins<it.price)return toast('Moedas insuficientes.');u.coins-=it.price;
 if(it.consume){u.xp+=50;checkAch(u);toast('⚡ +50 XP aplicados!')}
 else{u.inventory.push(it.id);toast('🛒 '+it.name+' adquirido! Equipe em Conquistas → Personalização.')}
 save();render()}

  if(+sel.value===m.correct){db.responses.push({id:'R'+Date.now(),missionId:mid,studentId:u.id,answer:ans,status:'ok',date:new Date().toISOString()});award(u,m);toast('✅ Resposta correta! +'+m.xp+' XP, +'+m.coins+' moedas')}
  else{db.responses.push({id:'R'+Date.now(),missionId:mid,studentId:u.id,answer:ans,status:'wrong',date:new Date().toISOString()});toast('❌ Resposta incorreta. Tente novamente.')}}
 else{ans=document.getElementById('w_ans').value.trim();if(ans.length<10)return toast('Escreva uma resposta com pelo menos 10 caracteres.');

 <span class="badge b-purple" style="margin-top:8px">${skillName(miss.skill)}</span>
 ${miss.img?`<div class="mimg-wrap"><img src="${miss.img}" class="mimg" onclick="openZoom(this.src)"></div><p class="tiny" style="margin-top:6px;text-align:center">🔍 Clique na imagem para ampliar</p>`:''}
 <p style="margin-top:14px;font-weight:600">${miss.q}</p>
 ${miss.type==='multipla'?miss.opts.map(o=>`<label class="opt" style="opacity:.85"><input type="radio" disabled> ${o}</label>`).join(''):`<label>Resposta escrita</label><textarea disabled placeholder="O aluno escreverá aqui a interpretação com evidências do texto..."></textarea>`}
 <p class="tiny" style="margin-top:12px">É assim que o estudante verá o desafio: imagem → enunciado → alternativas.</p></div></div>`}
 if(m.type==='answer'){return`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
 <div class="spread"><h2>${miss.title}</h2><button class="btn ghost sm" onclick="closeModal()">fechar</button></div>
 <p class="muted">📖 ${miss.book}${miss.author?' · '+miss.author:''}</p><span class="badge b-purple" style="margin-top:8px">${skillName(miss.skill)}</span>
 ${miss.img?`<div class="mimg-wrap"><img src="${miss.img}" class="mimg" onclick="openZoom(this.src)" alt="Imagem da missão"></div><p class="tiny" style="margin-top:6px;text-align:center">🔍 Clique na imagem para ampliar e ler os detalhes</p>`:''}
 <p style="margin-top:14px;font-weight:600">${miss.q}</p>
 ${miss.type==='multipla'?miss.opts.map((o,i)=>`<label class="opt"><input type="radio" name="opt" value="${i}"> ${o}</label>`).join(''):`<label>Sua resposta (cite evidências do texto)</label><textarea id="w_ans" placeholder="Escreva sua interpretação citando trechos do livro..."></textarea>`}
 <button class="btn" style="margin-top:16px" onclick="submitAnswer('${miss.id}')">Enviar resposta</button></div></div>`}
 if(m.type==='conc'){const rs=db.responses.filter(r=>r.missionId===miss.id);
 return`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
 <div class="spread"><div class="row">${miss.img?`<img src="${miss.img}" class="thumb" style="width:44px;height:44px" onclick="openZoom('${miss.img}')">`:''}<h2>Conclusões · ${miss.title}</h2></div><button class="btn ghost sm" onclick="closeModal()">fechar</button></div>
 ${rs.length?rs.map(r=>{const s=db.users.find(x=>x.id===r.studentId);const stb=r.status==='ok'?'<span class="badge b-green">confirmada</span>':r.status==='pending'?'<span class="badge b-amber">pendente</span>':r.status==='wrong'?'<span class="badge b-red">incorreta</span>':'<span class="badge b-gray">recusada</span>';
 const ansTxt=miss.type==='multipla'?('Alternativa '+(+r.answer+1)+': '+miss.opts[+r.answer]):r.answer;
 const tc=s?eqVal(s,'textColor'):null;const tf=s?eqVal(s,'textEffect'):null;
 return`<div class="card" style="margin-top:12px"><div class="spread"><b>${s?displayName(s):'?'} <span class="tiny">${s?s.id:''}</span></b>${stb}</div><p class="muted ${tf?'fx-'+tf:''}" style="margin-top:6px;${tc?'color:'+tc:''}">${ansTxt}</p>
 ${r.status==='pending'?`<div class="row" style="margin-top:10px"><button class="btn sm" onclick="confirmResp('${r.id}')">Confirmar conclusão</button><button class="btn ghost sm" onclick="rejectResp('${r.id}')">Recusar</button></div>`:''}</div>`}).join(''):'<p class="muted" style="margin-top:12px">Nenhuma resposta enviada ainda.</p>'}</div></div>`}
 return''}
function applyTheme(){const u=me();const th=u?eqVal(u,'theme'):null;const r=document.documentElement.style;r.setProperty('--acc',th?th.acc:'#4f46e5');r.setProperty('--acc-soft',th?th.soft:'#e9e7fb')}
function render(){document.querySelectorAll('.overlay').forEach(e=>e.remove());applyTheme();const app=document.getElementById('app');const u=me();
 if(!u){session=null;app.innerHTML=authHTML();return}
 app.innerHTML=u.role==='aluno'?studentHTML(u):teacherHTML(u);
 if(ui.modal)document.body.insertAdjacentHTML('beforeend',modalHTML())}
render();
</script>
</body>
</html>
